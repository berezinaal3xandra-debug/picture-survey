<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оценка фотографий</title>
<style>
  :root { --bg:#f4f4f2; --fg:#1d1d1b; --card:#ffffff; --accent:#2b5fd9; --muted:#6b6b66; --line:#d6d6d0; --warn:#a35a00; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  #app { min-height:100%; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 32px; max-width:760px; width:100%; }
  .card.wide { max-width:860px; }
  h1 { font-size:24px; margin:0 0 14px; }
  h2 { font-size:20px; margin:0 0 12px; }
  p { margin:0 0 12px; }
  ul { margin:0 0 12px; padding-left:22px; }
  a { color:var(--accent); }
  .muted { color:var(--muted); font-size:15px; }
  .banner { border:1px solid var(--warn); color:var(--warn); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:15px; }
  .note { background:var(--bg); border-radius:10px; padding:12px 14px; margin:0 0 12px; }
  button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--fg); padding:10px 18px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
  label.check { display:flex; gap:10px; align-items:flex-start; margin:16px 0 4px; cursor:pointer; }
  label.check input { margin-top:6px; width:18px; height:18px; flex:none; }
  .field { margin:0 0 14px; }
  .field label { display:block; font-weight:600; margin-bottom:4px; }
  .field input, .field select, .field textarea { font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--fg); }
  .err { color:#b3261e; min-height:1.4em; margin:6px 0 0; font-size:15px; }
  .q { margin:0 0 26px; }
  .qt { font-weight:600; margin:0 0 10px; }
  .scale { display:grid; grid-template-columns:repeat(9,1fr); gap:6px; }
  .scale button { padding:12px 0; }
  .scale button.sel { background:var(--accent); border-color:var(--accent); color:#fff; }
  .labels { display:grid; grid-template-columns:1fr 1fr 1fr; font-size:14px; color:var(--muted); margin-top:6px; }
  .labels span:nth-child(2) { text-align:center; } .labels span:nth-child(3) { text-align:right; }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:14px 0; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .15s; }
  .thumb { max-width:260px; max-height:200px; display:block; margin:0 auto 14px; border-radius:6px; }
  .code { font:600 26px/1.2 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.12em; padding:10px 14px; background:var(--bg); border-radius:10px; display:inline-block; }
  .prog { text-align:right; font-size:14px; color:var(--muted); margin:-8px 0 10px; }
  table.ex { border-collapse:collapse; width:100%; margin:0 0 14px; font-size:15px; }
  table.ex th, table.ex td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  table.ex th { background:var(--bg); }
  .radio { display:flex; gap:18px; flex-wrap:wrap; margin:6px 0 12px; }
  .radio label { display:flex; gap:8px; align-items:center; cursor:pointer; }
  .card.xwide { max-width:1100px; }
  .trial { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:28px; align-items:start; }
  .trial .pic { text-align:center; position:sticky; top:12px; }
  .trial .pic img { max-width:100%; max-height:78vh; width:auto; height:auto; border-radius:8px; display:block; margin:0 auto; }
  @media (max-width: 860px) {
    #app { padding:10px; }
    .card { padding:20px 16px; }
    .trial { grid-template-columns:1fr; gap:16px; }
    .trial .pic { position:static; }
    .trial .pic img { max-height:46vh; }
    .scale { gap:4px; }
    .scale button { padding:12px 0; }
    .labels { font-size:12px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   НАСТРОЙКИ. Меняйте только значения в этом блоке.
   Всё, что в [квадратных скобках], нужно заменить своим текстом.
   ===================================================================== */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbzDlRaKqBUP1lVRd_W01C0jJlUQlAHmp6HVZYAfnp43sUwXaPPl1nYwaapy5dhJYVIEaQ/exec",      // адрес веб-приложения Google Apps Script (оканчивается на /exec)
  RESEARCHER: "Березина Александра",
  ORGANIZATION: "МГЛУ",
  CONTACT_EMAIL: "berezina.al3xandra@gmail.com",


  // Ссылки на документ(ы) согласия. Файл загрузите в репозиторий рядом с index.html.
  // Если файл .docx: на странице будут две ссылки: «открыть в браузере» (онлайн-просмотр Office) и «скачать файл».
  // Самый надёжный вариант: сохраните согласие как PDF (consent.pdf) и впишите это имя: он открывается в браузере сам.
  // Если оставить пустую строку "", ссылка на странице не показывается.
  CONSENT_URL: "consent.docx",          // согласие на участие
  CONSENT_DATA_URL: "consent.docx",     // согласие на обработку персональных данных (можно тот же файл)

  IMG_DIR: "",                 // картинки лежат в корне репозитория, рядом с index.html (если будут в папке, напишите "images/")
  IMG_EXT: ".jpg",              // основное расширение; если файла нет, скрипт пробует ещё .jpeg, .png и варианты в верхнем регистре
  // Ваши 60 картинок: имена файлов БЕЗ расширения (на сайте они лежат как <имя>.jpg).
  // Имена должны совпадать с файлами буква в букву, включая регистр.
  MAIN_IMAGES: [
    "declan-sun-RZv4hCmoN0k-unsplash",
    "declan-sun-YgNKHG8r8Zc-unsplash",
    "frank-huang-AWA3T5dwp7Q-unsplash",
    "joao-emanuel-tg8j8CF6JbQ-unsplash",
    "karla-hernandez-shn9z-172sM-unsplash",
    "leo-d-1o5hFRQ77l0-unsplash",
    "mark-dixon-hLYbJB-D5Gg-unsplash",
    "pexels-236636281-38420518",
    "pexels-alexis-b-1699196-38549297",
    "pexels-alexis-b-1699196-38721732",
    "pexels-alina-lebedeva-2160623516-37190533",
    "pexels-alion-n-2164306600-39614634",
    "pexels-amina-redza-2158448108-38779756",
    "pexels-anastasiiabilyk-29516991",
    "pexels-antonio-mor-1058419054-20487856",
    "pexels-bayram-yalcin-86843184-31516058",
    "pexels-clarence-chan-2160207969-36949785",
    "pexels-codrin-rusu-147523801-10474664",
    "pexels-damir-19117176",
    "pexels-danielwells67-39345915",
    "pexels-danila-popov-85164195-9684917",
    "pexels-deklansor-432236846-15259666",
    "pexels-dmitry93-32114413",
    "pexels-eva-al-1617171197-27914040",
    "pexels-geoffrey-zhao-2157815655-36873767",
    "pexels-heey-dilara-2154720417-36723258",
    "pexels-humeyrakalkan-17276825",
    "pexels-irrabagon-37036052",
    "pexels-jan-van-der-wolf-11680885-14943866",
    "pexels-jasper-hunter-692558448-31795331",
    "pexels-jessikaarraes-39238778",
    "pexels-m-e-r-v-e-42708268-16682066",
    "pexels-manolyaizgigezgin-38086853",
    "pexels-michael-koneckiy-461417719-20585270",
    "pexels-mxkrv-3655916-11288345",
    "pexels-natalia-sevruk-636238602-38141724",
    "pexels-onbab-18313672",
    "pexels-ozgarts-38390177",
    "pexels-perry-2164439915-39820670",
    "pexels-pixtelslinks-2164250203-39553625",
    "pexels-ridvan-guler-536399736-36914851",
    "pexels-robertkso-13992799",
    "pexels-rok-galun-2164299005-39725703",
    "pexels-roman-ska-3453281-9150882",
    "pexels-samuelgoldberg-30445534",
    "pexels-spitak-30181353",
    "pexels-stelios-117223391-39635098",
    "pexels-sveta-k-75705601-12486376",
    "pexels-tess-h-312625-37942157",
    "pexels-tu-tr-n-2161865816-37920802",
    "pexels-valeria-drozdova-2148646707-35354687",
    "pexels-volokyta-18609840",
    "pexels-wal_-172619-2156618639-37535009",
    "pexels-yesimcolak-32993788",
    "pexels-yuraforrat-11960629",
    "pexels-yuraforrat-19928078",
    "set-sj-s4n4QNPduZE-unsplash",
    "sies-kranen-B69QZzfJCXg-unsplash",
    "sijmen-van-hooff-spTIl-cAHq4-unsplash",
    "yang-rui-wQkVPfw8vIk-unsplash"
  ],
  // Якорные картинки (необязательно). 0 = не использовать.
  // Если появятся, назовите файлы: anc_pos_01.jpg.., anc_neg_01.jpg.., anc_neu_01.jpg..
  N_POS: 0, N_NEG: 0, N_NEU: 0,

  BREAK_EVERY: 15,              // перерыв после каждых N картинок
  N_ASSOC: 12,                  // для скольких картинок показывать необязательное поле «ассоциации» (0 = нигде)
  MIN_AGE: 18,

  ALLOW_REPEAT: true,           // кнопка «Пройти ещё раз» в конце
  ASK_CONTACT: false,            // в конце спросить, готов ли человек участвовать в других исследованиях, и собрать контакт
  LINK_CONTACT_TO_CODE: false,  // false: контакт хранится отдельно и НЕ связан с ответами; true: рядом пишется код участника
  VERSION: "1.4"
};
/* ===================================================================== */

const params = new URLSearchParams(location.search);
const TEST = params.has('test');           // ?test  -> тестовый режим, данные НЕ отправляются

const ANON = 'Данные собираются анонимно: имя, адрес электронной почты и другая информация, позволяющая установить личность участника, не запрашиваются. Все полученные данные будут храниться в обезличенном виде и использоваться только в рамках научной работы, исследовательских публикаций, академических презентаций и конференций.';
window.__sent = [];

const $app = document.getElementById('app');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nowMs = () => performance.now();
const pad = (n, w) => String(n).padStart(w, '0');
const IMG_EXTS = [CONFIG.IMG_EXT].concat(['.jpg', '.jpeg', '.png', '.JPG', '.JPEG', '.PNG'].filter(e => e !== CONFIG.IMG_EXT));

function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function sample(a, n) { return shuffle(a).slice(0, n); }
function makeCode() { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += ch[Math.floor(Math.random() * ch.length)]; return s; }
/* ---------- список картинок ---------- */
const ids = {
  main: CONFIG.MAIN_IMAGES.slice(),
  anchors: [].concat(
    Array.from({ length: CONFIG.N_POS }, (_, i) => 'anc_pos_' + pad(i + 1, 2)),
    Array.from({ length: CONFIG.N_NEG }, (_, i) => 'anc_neg_' + pad(i + 1, 2)),
    Array.from({ length: CONFIG.N_NEU }, (_, i) => 'anc_neu_' + pad(i + 1, 2)))
};
const imageType = id => id.startsWith('anc_') ? id.slice(0, 7) : 'main';

/* ---------- состояние ---------- */
const S = {
  pid: makeCode(), attempt: 1, demo: {}, nickname: '',
  unsent: [], unsentPages: [], trialsSent: 0, active: false,
  tStart: new Date(), tPerf: nowMs(), screenW: window.innerWidth, screenH: window.innerHeight,
  consentAt: { participation: '', data: '' }, contactDone: false
};
const runId = () => S.attempt === 1 ? S.pid : S.pid + '-' + S.attempt;
const cache = new Map();

window.addEventListener('beforeunload', e => { if (S.active) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- логи страниц (время открытия и закрытия каждого экрана) ---------- */
let CUR = null;
function openScreen(name, image, position) {
  CUR = { screen: name, image: image || '', position: position === undefined ? '' : position, opened_at: new Date().toISOString(), o: nowMs() };
}
function closeScreen() {
  if (!CUR) return;
  const c = CUR; CUR = null;
  S.unsentPages.push({ participant: runId(), attempt: S.attempt, screen: c.screen, image: c.image, position: c.position,
    opened_at: c.opened_at, closed_at: new Date().toISOString(), opened_ms: Math.round(c.o - S.tPerf), duration_ms: Math.round(nowMs() - c.o) });
}
document.addEventListener('visibilitychange', () => {
  const t = new Date().toISOString();
  S.unsentPages.push({ participant: runId(), attempt: S.attempt, screen: document.hidden ? 'TAB_HIDDEN' : 'TAB_VISIBLE',
    image: CUR ? CUR.screen : '', position: '', opened_at: t, closed_at: t, opened_ms: Math.round(nowMs() - S.tPerf), duration_ms: 0 });
});

function setScreen(node, stim, name, image, position) {
  closeScreen();
  document.body.classList.toggle('stimbg', !!stim);
  $app.replaceChildren(node);
  try { window.scrollTo(0, 0); } catch (e) { /* не страшно */ }
  openScreen(name || 'screen', image, position);
}
function page(name, html, bind, cls) {
  return new Promise(resolve => { const n = el('<div class="card ' + (cls || '') + '">' + html + '</div>'); setScreen(n, false, name); bind(n, resolve); });
}

/* ---------- отправка данных ---------- */
async function post(payload) {
  if (TEST) { window.__sent.push(JSON.parse(JSON.stringify(payload))); return true; }
  const body = JSON.stringify(payload);
  for (let k = 0; k < 2; k++) {
    try {
      await fetch(CONFIG.ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, keepalive: body.length < 60000 });
      return true;
    } catch (e) { await sleep(800); }
  }
  return false;
}
async function flush(participantRow) {
  const trials = S.unsent.splice(0, S.unsent.length);
  const pages = S.unsentPages.splice(0, S.unsentPages.length);
  const payload = { trials: trials, pages: pages };
  if (participantRow) payload.participant = participantRow;
  if (!trials.length && !pages.length && !participantRow) return true;
  const ok = await post(payload);
  if (ok) S.trialsSent += trials.length; else { S.unsent.unshift(...trials); S.unsentPages.unshift(...pages); }
  return ok;
}

/* ---------- ошибки: показываем причину, а не молчим ---------- */
let fatalShown = false;
function fatal(err) {
  if (fatalShown) return; fatalShown = true; S.active = false;
  const msg = String(err && err.message ? err.message : err);
  console.error(err);
  setScreen(el('<div class="card"><h2>Произошла техническая ошибка</h2><p>Пожалуйста, обновите страницу и пройдите исследование заново. Если ошибка повторится, сообщите исследователю: ' + CONFIG.CONTACT_EMAIL + '.</p><p class="muted">Код ошибки: ' + msg.replace(/[<>&]/g, '') + ' (участник ' + S.pid + ')</p></div>'), false, 'fatal_error');
}
window.addEventListener('error', e => {
  if (!e.filename || e.filename.indexOf(location.origin) === 0 || e.filename === location.href) fatal(e.error || e.message);
});

/* ---------- вспомогательное для текста ---------- */
function docLink(url, text) {
  if (!url) return '';
  let abs = url;
  try { abs = new URL(url, location.href).href; } catch (e) { /* оставим как есть */ }
  if (/\.docx?$/i.test(url)) {
    return '<p class="note">' + text + ': <a href="https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(abs) + '" target="_blank" rel="noopener">открыть в браузере</a> · <a href="' + encodeURI(url) + '" download>скачать файл</a></p>';
  }
  return '<p class="note">' + text + ': <a href="' + encodeURI(url) + '" target="_blank" rel="noopener">открыть документ</a></p>';
}

/* ---------- экраны ---------- */
async function welcome() {
  let banners = '';
  if (TEST) banners += '<div class="banner">ТЕСТОВЫЙ РЕЖИМ: данные никуда не отправляются.</div>';
  if (!TEST && CONFIG.ENDPOINT.indexOf('PASTE') === 0) banners += '<div class="banner">Внимание (для исследователя): адрес для сохранения данных не настроен, ответы не будут отправлены.</div>';
  const n = ids.main.length + ids.anchors.length;
  await page('welcome', banners +
    '<h1>Оценка фотографий</h1>' +
    '<p>Вам будет показано ' + n + ' фотографий по одной. Каждую нужно оценить по двум шкалам: насколько она приятна или неприятна и насколько сильную эмоциональную реакцию вызывает. Для некоторых фотографий можно по желанию написать несколько слов. Правильных и неправильных ответов нет, важно ваше личное впечатление. Время на ответ не ограничено, но мы фиксируем, сколько его уходит на каждую фотографию.</p>' +
    '<p>Понадобится компьютер, ноутбук или телефон и около 15–20 минут. Будут короткие перерывы.</p>' +
    '<p class="muted">Некоторые фотографии могут показаться вам неприятными (умеренно). Участие добровольное, прекратить его можно в любой момент, закрыв страницу.</p>' +
    '<div class="row"><button class="primary" id="go">Далее</button></div>',
    (n2, res) => { n2.querySelector('#go').onclick = () => res(); });
}

/* одна страница: документ согласия + две отметки */
async function consent() {
  const same = CONFIG.CONSENT_DATA_URL === CONFIG.CONSENT_URL;
  return page('consent',
    '<h2>Согласие на участие и на обработку персональных данных</h2>' +
    '<p>Пожалуйста, прочитайте документ' + (same ? '' : 'ы') + ' и отметьте согласие.</p>' +
    docLink(CONFIG.CONSENT_URL, same ? 'Документ согласия' : 'Согласие на участие') +
    (same ? '' : docLink(CONFIG.CONSENT_DATA_URL, 'Согласие на обработку персональных данных')) +
    '<ul>' +
      '<li>Участие добровольное. Вы вправе отказаться от участия и прекратить его в любой момент, закрыв страницу, без объяснения причин и без каких-либо последствий.</li>' +
      '<li>Данные собираются анонимно: имя, адрес электронной почты и другая информация, позволяющая установить личность участника, не запрашиваются.</li>' +
      '<li>Собираются: никнейм (любой, не настоящее имя), номер телефона или e-mail, пол, возраст, ваши оценки фотографий, необязательные слова-ассоциации и время, затраченное на ответы.</li>' +
      '<li>Все полученные данные хранятся в обезличенном виде и используются только в рамках научной работы, исследовательских публикаций, академических презентаций и конференций.</li>' +
      '<li>Вы можете отозвать согласие в любой момент: в конце исследования вам будет показан код участника, по нему ваши ответы можно найти и удалить (обратитесь по адресу ' + CONFIG.CONTACT_EMAIL + ').</li>' +
    '</ul>' +
    '<label class="check"><input type="checkbox" id="c1"> <span>Мне ' + CONFIG.MIN_AGE + ' лет или больше, я прочитал(а) документ и согласен(на) участвовать в исследовании.</span></label>' +
    '<label class="check"><input type="checkbox" id="c2"> <span>Я даю согласие на обработку персональных данных на условиях, указанных в документе.</span></label>' +
    '<div class="row"><button class="primary" id="go" disabled>Продолжить</button><button id="no">Не согласен(на)</button></div>',
    (n, res) => {
      const c1 = n.querySelector('#c1'), c2 = n.querySelector('#c2'), go = n.querySelector('#go');
      const upd = () => { go.disabled = !(c1.checked && c2.checked); };
      c1.onchange = upd; c2.onchange = upd;
      go.onclick = () => { const t = new Date().toISOString(); S.consentAt.participation = t; S.consentAt.data = t; res(true); };
      n.querySelector('#no').onclick = () => res(false);
    });
}

function declined() {
  setScreen(el('<div class="card"><h2>Спасибо!</h2><p>Вы отказались от участия, никакие данные не сохранены. Эту страницу можно закрыть.</p></div>'), false, 'declined');
  return new Promise(() => {});
}
function ageDenied() {
  S.active = false; S.unsent = []; S.unsentPages = [];     // ничего не отправляем
  setScreen(el('<div class="card"><h2>Извините</h2>' +
    '<p>К сожалению, участие в данном исследовании возможно только для лиц, достигших ' + CONFIG.MIN_AGE + ' лет.</p>' +
    '<p>Благодарим вас за проявленный интерес и уделённое время. Введённые вами данные не сохранены. Эту страницу можно закрыть.</p></div>'), false, 'age_denied');
  return new Promise(() => {});
}

async function demographics() {
  return page('demographics',
    '<h2>Несколько вопросов о вас</h2>' +
    '<div class="field"><label for="nick">Никнейм</label><input id="nick" type="text" maxlength="40" autocomplete="off" placeholder="любой, можно даже один символ">' +
      '<div class="muted">Он нужен только для того, чтобы отличать участников друг от друга. Настоящее имя указывать не нужно.</div></div>' +
    '<div class="field"><label for="contact">Номер телефона или e-mail</label><input id="contact" type="text" maxlength="80" autocomplete="off"></div>' +
    '<div class="field"><label for="gender">Пол</label><select id="gender"><option value="">— выберите —</option><option>женский</option><option>мужской</option></select></div>' +
    '<div class="field"><label for="age">Возраст (полных лет)</label><input id="age" type="number" min="1" max="120" inputmode="numeric"></div>' +
    '<p class="err" id="err"></p>' +
    '<div class="row"><button class="primary" id="go">Продолжить</button></div>',
    (n, res) => {
      n.querySelector('#go').onclick = () => {
        const g = id => n.querySelector('#' + id).value.trim();
        const age = parseInt(g('age'), 10);
        if (!g('nick') || !g('contact') || !g('gender') || isNaN(age)) { n.querySelector('#err').textContent = 'Пожалуйста, заполните все поля.'; return; }
        if (age < CONFIG.MIN_AGE) { ageDenied(); return; }
        if (age > 99) { n.querySelector('#err').textContent = 'Проверьте возраст.'; return; }
        res({ nickname: g('nick'), contact_info: g('contact'), gender: g('gender'), age: age });
      };
    });
}

async function instructions(isRepeat) {
  await page('instructions',
    '<h2>' + (isRepeat ? 'Повторное прохождение' : 'Как проходит исследование') + '</h2>' +
    (isRepeat ? '<p class="note">Вы проходите исследование ещё раз. Порядок фотографий будет другим. Ваше согласие и ответы на вопросы о себе остаются прежними.</p>' : '') +
    '<p>Во время эксперимента вам будут показаны фотографии, по одной. <b>Ваша задача: оценить, какие чувства вызывает у вас каждая фотография, то есть насколько она приятна или неприятна и насколько сильную эмоциональную реакцию вызывает.</b></p>' +
    '<p>Фотография остаётся на экране, пока вы отвечаете. Рядом с ней (на телефоне - под ней) будут два вопроса, на каждый нужно выбрать число от 1 до 9. Затем нажмите «Далее».</p>' +
    '<ul><li><b>Приятность:</b> хорошо или плохо вам от этой фотографии. От «очень неприятная» (1) до «очень приятная» (9); 5 означает «ни приятная, ни неприятная».</li>' +
    '<li><b>Сила эмоциональной реакции:</b> насколько сильное чувство она вызывает, неважно, приятное или неприятное. От «совершенно спокойно» (1) до «очень сильная реакция» (9).</li></ul>' +
    '<p>Эти два вопроса не зависят друг от друга. Например:</p>' +
    '<table class="ex"><tr><th></th><th>Слабая реакция</th><th>Сильная реакция</th></tr>' +
    '<tr><th>Приятно</th><td>тёплая чашка чая, спокойный вечер</td><td>долгожданная радостная новость</td></tr>' +
    '<tr><th>Неприятно</th><td>скучная очередь, лёгкая досада</td><td>внезапная опасность, сильный испуг</td></tr></table>' +
    '<p>Правильных и неправильных ответов нет: нас интересует ваше личное впечатление. Время на ответ не ограничено, мы лишь фиксируем, сколько его уходит на каждую фотографию. Любое значение на шкале, в том числе среднее, является полноценным ответом.</p>' +
    '<p>Для некоторых фотографий появится дополнительное поле: по желанию напишите 1–3 слова о том, что она вам напомнила. Не пишите имена и личные данные. Перерыв будет после каждых ' + CONFIG.BREAK_EVERY + ' фотографий.</p>' +
    '<div class="row"><button class="primary" id="go">Загрузить фотографии и начать</button></div>',
    (n, res) => { n.querySelector('#go').onclick = () => res(); });
}

/* ---------- загрузка картинок (пробует несколько расширений) ---------- */
function loadImage(id) {
  return new Promise(res => {
    const im = new Image(); let i = 0;
    const tryNext = () => { if (i >= IMG_EXTS.length) { res(null); return; } im.src = CONFIG.IMG_DIR + id + IMG_EXTS[i++]; };
    im.onload = () => res(im); im.onerror = tryNext; tryNext();
  });
}
async function preload(list) {
  const todo = list.filter(id => !cache.has(id));
  const bar = el('<div class="card"><h2>Загрузка картинок…</h2><div class="bar"><div id="b"></div></div><p class="muted" id="t">0 / ' + todo.length + '</p></div>');
  setScreen(bar, false, 'preload');
  const missing = []; let done = 0;
  await Promise.all(todo.map(async id => {
    const im = await loadImage(id);
    if (im) cache.set(id, im); else missing.push(id);
    done++; bar.querySelector('#b').style.width = (100 * done / todo.length) + '%'; bar.querySelector('#t').textContent = done + ' / ' + todo.length;
  }));
  return missing;
}

/* ---------- проба: фото и шкалы на одной странице, без ограничения времени ---------- */
function scaleHtml(key, left, mid, right) {
  let b = ''; for (let i = 1; i <= 9; i++) b += '<button type="button" class="sc" data-k="' + key + '" data-v="' + i + '">' + i + '</button>';
  return '<div class="scale">' + b + '</div><div class="labels"><span>' + left + '</span><span>' + mid + '</span><span>' + right + '</span></div>';
}
function trialPage(info, id, pos, askAssoc) {
  return new Promise(resolve => {
    const n = el('<div class="card xwide"><div class="prog">' + info + '</div><div class="trial">' +
      '<div class="pic"><img alt=""></div><div class="qs">' +
      '<div class="q"><p class="qt">1. Насколько приятной или неприятной вам кажется эта фотография?</p>' + scaleHtml('v', '1 — очень неприятная', '5 — нейтральная', '9 — очень приятная') + '</div>' +
      '<div class="q"><p class="qt">2. Насколько сильную эмоциональную реакцию вызывает у вас эта фотография?</p>' + scaleHtml('a', '1 — совершенно спокойно', '', '9 — очень сильная реакция') +
      '<p class="muted" style="margin-top:8px">Оцените именно силу реакции, а не то, нравится ли вам фотография.</p></div>' +
      (askAssoc ? '<div class="q"><p class="qt">3. По желанию: какие слова или образы приходят вам в голову?</p><p class="muted">Напишите 1–3 слова. Можно оставить пустым. Не пишите имена и личные данные.</p><div class="field"><input id="t" type="text" maxlength="100" autocomplete="off"></div></div>' : '') +
      '<div class="row"><button class="primary" id="next" disabled>Далее</button></div></div></div></div>');
    n.querySelector('img').src = cache.get(id).src;
    setScreen(n, false, 'trial', id, pos);
    const R = { v: null, a: null, rt_v: null, rt_a: null };
    const t0 = nowMs();                       // отсчёт времени: с момента показа страницы с фотографией
    n.querySelectorAll('.sc').forEach(b => b.onclick = () => {
      const k = b.dataset.k, v = Number(b.dataset.v);
      if (R['rt_' + k] === null) R['rt_' + k] = Math.round(nowMs() - t0);   // время до первого выбора на шкале
      R[k] = v;
      n.querySelectorAll('.sc[data-k="' + k + '"]').forEach(x => x.classList.toggle('sel', x === b));
      n.querySelector('#next').disabled = !(R.v !== null && R.a !== null);
    });
    n.querySelector('#next').onclick = () => {
      const t = n.querySelector('#t');
      resolve({ v: R.v, a: R.a, rt_v: R.rt_v, rt_a: R.rt_a, rt_total: Math.round(nowMs() - t0), assoc: t ? t.value.trim() : '' });
    };
  });
}
function breakScreen(done, total) {
  return page('break_' + done, '<h2>Небольшой перерыв</h2><p>Вы оценили ' + done + ' из ' + total + ' фотографий. Отдохните, и когда будете готовы, нажмите кнопку.</p><div class="row"><button class="primary" id="go">Продолжить</button></div>',
    (n, res) => { n.querySelector('#go').onclick = () => res(); });
}
async function runTrial(id, phase, position, askAssoc, info) {
  const r = await trialPage(info, id, position, askAssoc);
  S.unsent.push({
    participant: runId(), attempt: S.attempt, phase: phase, position: position, image: id, image_type: imageType(id),
    valence: r.v, arousal: r.a, rt_valence_ms: r.rt_v, rt_arousal_ms: r.rt_a, rt_total_ms: r.rt_total,
    assoc_asked: askAssoc ? 1 : 0, association: r.assoc, client_time: new Date().toISOString()
  });
}

/* ---------- финал: пояснение, контакт, повтор ---------- */
function downloadFallback() {
  const blob = new Blob([JSON.stringify({ participant: runId(), rows: S.unsent, pages: S.unsentPages, demo: S.demo }, null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  return '<div class="banner">Не удалось отправить ответы автоматически (возможно, нет связи). Пожалуйста, скачайте файл и отправьте его на ' + CONFIG.CONTACT_EMAIL +
    '.<br><a download="answers_' + runId() + '.json" href="' + url + '">Скачать файл с ответами</a></div>';
}
function endScreen(ok) {
  return new Promise(resolve => {
    S.active = false;
    const contactBlock = (CONFIG.ASK_CONTACT && !S.contactDone) ?
      '<div id="cb" class="note"><p class="qt">Готовы ли вы участвовать в других наших исследованиях?</p>' +
      '<div class="radio"><label><input type="radio" name="fut" value="yes"> Да</label><label><input type="radio" name="fut" value="no"> Нет</label></div>' +
      '<div id="cf" style="display:none"><div class="field"><label for="ct">Как с вами связаться? (e-mail, Telegram и т.п.)</label><input id="ct" type="text" maxlength="100" autocomplete="off"></div>' +
      '<label class="check"><input type="checkbox" id="cc"> <span>Я согласен(на), чтобы мой контакт хранился отдельно от моих ответов и использовался только для приглашений в исследования. Я могу попросить удалить его в любой момент (' + CONFIG.CONTACT_EMAIL + ').</span></label></div>' +
      '<p class="err" id="cerr"></p><div class="row"><button class="primary" id="csend" disabled>Отправить</button></div></div>' : '';
    const n = el('<div class="card"><h2>Спасибо за участие!</h2>' + (ok ? '' : downloadFallback()) +
      '<p><b>Зачем это исследование.</b> Мы определяем, какие фотографии люди воспринимают как нейтральные (ни приятные, ни неприятные, с очень слабой эмоциональной реакцией), чтобы затем использовать их в других исследованиях. Мы не говорили об этом заранее, чтобы это не повлияло на ваши оценки.</p>' +
      '<p>Ваш код участника (сохраните его, если захотите отозвать данные):</p><p><span class="code">' + S.pid + '</span></p>' +
      '<p class="muted">Чтобы отозвать согласие и удалить ваши ответы, напишите на ' + CONFIG.CONTACT_EMAIL + ' с этим кодом.</p>' + contactBlock +
      '<div class="row" id="rep"></div></div>');
    setScreen(n, false, 'end');

    if (contactBlock) {
      const radios = n.querySelectorAll('input[name="fut"]'), cf = n.querySelector('#cf'), cc = n.querySelector('#cc'), send = n.querySelector('#csend'), ct = n.querySelector('#ct');
      const refresh = () => {
        const v = (n.querySelector('input[name="fut"]:checked') || {}).value;
        cf.style.display = v === 'yes' ? '' : 'none';
        send.disabled = !(v === 'no' || (v === 'yes' && cc.checked && ct.value.trim()));
      };
      radios.forEach(r => r.onchange = refresh); cc.onchange = refresh; ct.oninput = refresh;
      send.onclick = async () => {
        const v = n.querySelector('input[name="fut"]:checked').value;
        send.disabled = true;
        const payload = { contact: { future_participation: v === 'yes' ? 'да' : 'нет', contact: v === 'yes' ? ct.value.trim() : '' } };
        if (CONFIG.LINK_CONTACT_TO_CODE) { payload.contact.participant = S.pid; payload.contact.nickname = S.nickname; }
        if (v === 'yes') await post(payload);
        else if (CONFIG.LINK_CONTACT_TO_CODE) await post(payload);
        S.contactDone = true;
        n.querySelector('#cb').innerHTML = '<p>Спасибо! ' + (v === 'yes' ? 'Мы сохранили ваш контакт.' : 'Ответ записан.') + '</p>';
      };
    }
    if (CONFIG.ALLOW_REPEAT) {
      const b = el('<button class="primary" id="again">Пройти исследование ещё раз</button>');
      n.querySelector('#rep').appendChild(b);
      b.onclick = async () => { b.disabled = true; closeScreen(); await flush(); resolve(true); };
    }
  });
}

/* ---------- один полный прогон эксперимента ---------- */
async function runExperiment(isRepeat) {
  await instructions(isRepeat);

  const all = [].concat(ids.main, ids.anchors);
  const missing = await preload(all);
  if (missing.length) {
    setScreen(el('<div class="card"><h2>Не удалось загрузить фотографии</h2><p>Проверьте соединение и обновите страницу. Если ошибка повторяется, сообщите исследователю (' + CONFIG.CONTACT_EMAIL + ').</p><p class="muted">Не найдено: ' + missing.slice(0, 10).join(', ') + (missing.length > 10 ? ' …' : '') + '</p></div>'), false, 'preload_error');
    return new Promise(() => {});
  }

  S.active = true; S.trialsSent = 0; S.tStart = new Date();

  // все фотографии в случайном порядке (свой порядок у каждого прохождения)
  const seq = shuffle(all);
  const assocSet = new Set(sample(ids.main, Math.min(CONFIG.N_ASSOC, ids.main.length)));
  for (let i = 0; i < seq.length; i++) {
    await runTrial(seq[i], 'main', i + 1, assocSet.has(seq[i]), 'Фотография ' + (i + 1) + ' из ' + seq.length);
    const done = i + 1;
    if (done % CONFIG.BREAK_EVERY === 0 && done < seq.length) {
      await flush();
      await breakScreen(done, seq.length);
    }
  }

  // итоговая строка участника и отправка
  const end = new Date();
  const prow = {
    participant: runId(), person_code: S.pid, attempt: S.attempt, nickname: S.nickname,
    start_time: S.tStart.toISOString(), end_time: end.toISOString(), duration_s: Math.round((end - S.tStart) / 1000),
    contact_info: S.demo.contact_info, gender: S.demo.gender, age: S.demo.age,
    screen_w: S.screenW, screen_h: S.screenH, n_trials_sent: S.trialsSent + S.unsent.length,
    consent_participation_at: S.consentAt.participation, consent_data_at: S.consentAt.data, version: CONFIG.VERSION
  };
  setScreen(el('<div class="card"><h2>Сохраняем ответы…</h2><p class="muted">Пожалуйста, не закрывайте страницу.</p></div>'), false, 'saving');
  const ok = await flush(prow);
  return endScreen(ok);       // вернёт true, если нажали «Пройти ещё раз»
}

async function main() {
  await welcome();
  if (!(await consent())) return declined();
  S.demo = await demographics();
  S.nickname = S.demo.nickname;
  let again = await runExperiment(false);
  while (again) {
    S.attempt += 1;
    again = await runExperiment(true);
  }
}

window.__S = S;       // для отладки
main().catch(fatal);
})();
</script>
